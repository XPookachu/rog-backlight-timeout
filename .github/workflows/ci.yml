name: CI

# Every push to main and every pull request: restore (locked), check formatting, build with the analyzers as errors,
# run the tests, then build the release zip with scripts/publish.ps1 (the same script as a local build) and keep it
# as the "release" artifact.
#
# A vX.Y.Z tag also publishes that zip as a GitHub release, with a signed build-provenance attestation, so a download
# can be checked with: gh attestation verify <file> -R XPookachu/rog-backlight-timeout
# The version comes from the tag itself (MinVer): tag the commit, push the tag, nothing else to bump.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out (full history, MinVer reads the version from tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore RogBacklightTimeout.slnx --locked-mode

      - name: Check formatting
        run: dotnet format RogBacklightTimeout.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build RogBacklightTimeout.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution RogBacklightTimeout.slnx -c Release --no-build

      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipTests

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/RogBacklightTimeout.exe
            dist/RogBacklightTimeout-v*.zip
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - name: Check out (for the tag message)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/RogBacklightTimeout.exe
            dist/RogBacklightTimeout-v*.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="dist/RogBacklightTimeout-${TAG}.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::Built $(ls dist/*.zip), but the tag is ${TAG}: the version and the tag disagree."
            exit 1
          fi

          notes="$(git tag -l --format='%(contents:body)' "$TAG")"
          [ -n "$notes" ] || notes="$(git tag -l --format='%(contents:subject)' "$TAG")"
          {
            printf '%s\n\n' "$notes"
            echo "The download is a zip: RogBacklightTimeout.exe plus LICENSE (GPL-3.0-only), NOTICE.md, THIRD-PARTY-NOTICES.md, THIRD-PARTY-NOTICES-dotnet.txt and BUILD-INFO.txt. Keep them with the exe. Corresponding source: the ${TAG} tag."
            echo
            echo "Built by GitHub Actions ([run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})) with a signed build-provenance attestation. To verify a download: \`gh attestation verify RogBacklightTimeout-${TAG}.zip -R ${GITHUB_REPOSITORY}\`"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

          gh release create "$TAG" "$zip" dist/SHA256SUMS --verify-tag --title "$TAG" --notes-file notes.md
